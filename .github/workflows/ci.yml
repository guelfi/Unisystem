name: CI - Build & Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test-api:
    name: Build & Test API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore solution
        run: dotnet restore Unisystem.sln
        working-directory: src

      - name: Build
        run: dotnet build Unisystem.sln -c Release --no-restore
        working-directory: src

      - name: Test
        run: dotnet test Unisystem.sln -c Release --no-build
        working-directory: src

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build -- --configuration production --base-href=/unisystem/
        working-directory: frontend

  frontend-dependency-audit:
    name: Frontend Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Audit npm dependencies
        working-directory: frontend
        run: >
          npm audit --audit-level=high --json > /tmp/audit.json || true;
          node -e '
            const r = require("/tmp/audit.json");
            const allowed = new Set([
              "@angular-devkit/build-angular",
              "@angular/build",
              "brace-expansion",
              "glob",
              "karma",
              "karma-coverage",
              "karma-jasmine",
              "karma-jasmine-html-reporter",
              "minimatch",
              "postcss",
              "rimraf"
            ]);
            const unexpected = Object.entries(r.vulnerabilities || {})
              .filter(([name, v]) => v.severity === "high" || v.severity === "critical")
              .filter(([name]) => !allowed.has(name));
            if (unexpected.length > 0) {
              console.error("Vulnerabilidades inesperadas:", unexpected.map(([n]) => n).join(", "));
              process.exit(1);
            }
            console.log("OK: apenas vulnerabilidades conhecidas em devDependencies de build/test (karma, postcss, webpack tooling), sem fix publicado ainda na linha estavel (Angular 21 LTS). Nenhuma chega ao bundle de producao.");
          '

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [build-and-test-api, build-frontend, secret-scanning]
    steps:
      - uses: actions/checkout@v4

      - name: Build API Docker image
        run: docker build -f Dockerfile.api -t unisystem-api:test .

      - name: Build Frontend Docker image
        run: docker build -t unisystem-frontend:test .
        working-directory: frontend
