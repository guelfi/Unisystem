name: CI - Build & Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test-api:
    name: Build & Test API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore solution
        run: dotnet restore Unisystem.sln
        working-directory: src

      - name: Build
        run: dotnet build Unisystem.sln -c Release --no-restore
        working-directory: src

      - name: Test
        run: dotnet test Unisystem.sln -c Release --no-build
        working-directory: src

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build -- --configuration production --base-href=/unisystem/
        working-directory: frontend

  frontend-dependency-audit:
    name: Frontend Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Audit npm dependencies
        working-directory: frontend
        run: |
          npm audit --json > /tmp/audit.json || true
          node --test scripts/check-dependency-audit.test.cjs
          node scripts/check-dependency-audit.cjs /tmp/audit.json package-lock.json

      - name: Save dependency audit diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dependency-audit
          path: /tmp/audit.json
          retention-days: 3

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [build-and-test-api, build-frontend, secret-scanning]
    steps:
      - uses: actions/checkout@v4

      - name: Build API Docker image
        run: docker build -f Dockerfile.api -t unisystem-api:test .

      - name: Build Frontend Docker image
        run: docker build --build-arg BASE_HREF=/ --build-arg API_URL=/api -t unisystem-frontend:test .
        working-directory: frontend

      - name: Verify subdomain build contract
        run: |
          docker run --rm unisystem-frontend:test sh -c '
            grep -q '\''<base href="/">'\'' /usr/share/nginx/html/index.html
            ! grep -R -q /unisystem-api/api /usr/share/nginx/html
          '
